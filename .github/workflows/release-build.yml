# On each GitHub release publish (or manually for an existing release tag):
# 1. Build Android locally (expo prebuild + Gradle) → APK, via the reusable
#    android-build workflow that CI also runs on every pull request
# 2. Attach the APK to the release (no Play Store publish)
#
# No secrets required.

name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v0.3.0)"
        required: true

jobs:
  build:
    uses: ./.github/workflows/android-build.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      upload-artifact: true

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to attach the APK to the release
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: nodo-android-apk

      - name: Prepare release artifact
        run: mv app-release.apk "nodo-android-${{ env.TAG }}.apk"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: "nodo-android-${{ env.TAG }}.apk"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
