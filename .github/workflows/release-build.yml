# On each GitHub release publish (or manually for an existing release tag):
# 1. Build Android locally (expo prebuild + Gradle) → APK
# 2. Attach the APK to the release (no Play Store publish)
#
# No secrets required.

name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v0.3.0)"
        required: true

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to attach the APK to the release
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform and build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Build APK (release)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release artifact
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "nodo-android-${{ env.TAG }}.apk"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: "nodo-android-${{ env.TAG }}.apk"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
